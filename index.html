<!DOCTYPE html><html lang="id"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>GTFS - Pre-Register GTFS Reborn</title>    <link rel="stylesheet" href="style.css">    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">        <style>        /* CSS UNTUK VIDEO BACKGROUND */        #bgVideo {            position: fixed;            top: 50%;            left: 50%;            min-width: 100%;            min-height: 100%;            width: auto;            height: auto;            z-index: -1;            transform: translate(-50%, -50%);            object-fit: cover;        }        /* Tombol Mute/Unmute Musik Melayang */        .audio-btn {            position: fixed;            top: 20px;            right: 20px;            z-index: 999;            background: rgba(10, 11, 16, 0.8);            border: 1px solid #00f0ff;            color: #fff;            width: 45px;            height: 45px;            border-radius: 50%;            cursor: pointer;            font-size: 1.2rem;            display: flex;            justify-content: center;            align-items: center;            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);            transition: all 0.3s ease;        }        .audio-btn:hover {            transform: scale(1.1);            box-shadow: 0 0 15px #00f0ff;        }    </style></head><body>    <!-- VIDEO BACKGROUND (Wajib muted & playsinline agar otomatis jalan di HP) -->    <video autoplay loop muted playsinline preload="auto" id="bgVideo">    <source src="bg2.mp4" type="video/mp4"></video>    <div class="overlay"></div>    <!-- AUDIO PLAYER -->    <audio id="bgm" loop>        <source src="sld.mp3" type="audio/mpeg">    </audio>    <!-- TOMBOL KONTROL SUARA -->    <button id="audioBtn" class="audio-btn">        <span id="audioIcon">🔊</span>    </button>    <main class="container">        <header class="logo-area">            <h1 class="game-title">GTFS<span>ONLINE</span></h1>            <p class="tagline">BERSIAPLAH UNTUK PETUALANGAN MMORPG TERBESAR!</p>        </header>        <section class="card">            <div class="card-header">                <h2>PRE-REGISTER SEKARANG</h2>                <p>Dapatkan Hadiah Eksklusif Saat Server Resmi Dibuka!</p>            </div>            <form id="preRegForm" action="https://formspree.io/f/mpqyzqnd" method="POST">                <!-- Honeypot Anti-Spam -->                <input type="text" name="_gotcha" style="display:none !important">                <div class="input-group">                    <label for="name">NAMA LENGKAP / NICKNAME</label>                    <input type="text" id="name" name="Nama" placeholder="Masukkan nama kamu..." required autocomplete="off">                </div>                <div class="input-group">                    <label for="phone">NOMOR TELEPON (WHATSAPP)</label>                    <input type="tel" id="phone" name="No_HP" placeholder="08xxxxxxxxxx" required autocomplete="off">                </div>                <button type="submit" class="btn-submit">                    <span class="btn-text">KLAIM HADIAH & REGISTER</span>                    <span class="btn-glow"></span>                </button>            </form>            <div id="statusMessage" class="status-msg"></div>        </section>        <footer>            <p>&copy; 2022 GTFS Development Team. All Rights Reserved.</p>        </footer>    </main>    <script src="script.js"></script>    <!-- LOGIKA AUTO PLAY MUSIK -->    <script>        const bgm = document.getElementById('bgm');        const audioBtn = document.getElementById('audioBtn');        const audioIcon = document.getElementById('audioIcon');        bgm.volume = 0.3; // Volume 30%        function playAudio() {            bgm.play().then(() => {                audioIcon.innerText = '🔊';                removeAutoPlayListeners();            }).catch(() => {});        }        function removeAutoPlayListeners() {            document.removeEventListener('click', playAudio);            document.removeEventListener('touchstart', playAudio);            document.removeEventListener('scroll', playAudio);        }        // Langsung putar musik begitu ada sentuhan/klik/scroll pertama dari pengunjung        document.addEventListener('click', playAudio);        document.addEventListener('touchstart', playAudio);        document.addEventListener('scroll', playAudio);        // Fitur Tombol Mute/Unmute        audioBtn.addEventListener('click', function(e) {            e.stopPropagation();            if (bgm.paused) {                bgm.play();                audioIcon.innerText = '🔊';            } else {                bgm.pause();                audioIcon.innerText = '🔇';            }        });    </script></body></html>
